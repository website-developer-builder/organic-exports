<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section style="position:relative;overflow:hidden;background:#062319;font-family:'Plus Jakarta Sans',sans-serif">
  <img data-ken="" src="{{ img }}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0.55"></img>
  <span style="position:absolute;inset:0;background:linear-gradient(95deg,#062319 0%,rgba(6,35,25,0.92) 38%,rgba(6,35,25,0.45) 75%,rgba(6,35,25,0.25) 100%)"></span>
  <span style="position:absolute;inset:0;background:radial-gradient(600px 300px at 15% 110%,rgba(233,196,106,0.22),transparent 70%)"></span>
  <div style="position:relative;max-width:1320px;margin:0 auto;padding:40px clamp(18px,4vw,32px) clamp(43px,8vw,72px);display:flex;flex-direction:column;gap:44px">
    <nav style="display:flex;gap:10px;font:600 11px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:0.16em;color:#A9C2B5">
      <a href="Home.dc.html" style="color:#A9C2B5;text-decoration:none" style-hover="color:#F1CF7A">HOME</a><span>/</span><span style="color:#E9C46A">{{ crumb }}</span>
    </nav>
    <div style="display:flex;flex-wrap:wrap;gap:36px;justify-content:space-between;align-items:flex-end">
      <div style="flex:1 1 620px;display:flex;flex-direction:column;gap:20px;max-width:820px">
        <span style="display:flex;align-items:center;gap:14px;font:700 11px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:0.24em;color:#E9C46A"><span style="width:36px;height:1px;background:#E9C46A"></span>{{ eyebrow }}</span>
        <h1 style="margin:0;font:600 clamp(44px,5.2vw,76px)/0.98 'Cormorant Garamond',serif;letter-spacing:-0.015em;color:#FFFDF8;text-wrap:balance">{{ title }} <span style="font-style:italic;color:#F1CF7A">{{ accent }}</span></h1>
      </div>
      <p style="flex:0 1 400px;margin:0;font-size:16.5px;line-height:1.7;color:#C9D8CF;text-wrap:pretty">{{ intro }}</p>
    </div>
  </div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1320,&quot;height&quot;:420},&quot;crumb&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ABOUT&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;eyebrow&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;ABOUT ORGANIC EXPORTS&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;We connect Coimbatore’s farms&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;accent&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;to India’s markets.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;intro&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;img&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;assets/tomato-2.jpg&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
