<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<a data-zoom="" href="{{ href }}" style="position:relative;display:block;height:100%;min-height:340px;border-radius:22px;overflow:hidden;text-decoration:none;background:#0A3B2C;box-shadow:0 28px 50px -28px rgba(6,35,25,0.55),0 2px 6px rgba(6,35,25,0.08);font-family:'Plus Jakarta Sans',sans-serif;transition:transform .35s cubic-bezier(.2,.7,.2,1), box-shadow .35s" style-hover="transform:translateY(-6px);box-shadow:0 40px 70px -30px rgba(6,35,25,0.7),0 2px 6px rgba(6,35,25,0.1)">
  <img src="{{ img }}" alt="{{ title }}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block"></img>
  <span style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,26,18,0) 30%,rgba(4,26,18,0.55) 58%,rgba(4,26,18,0.94) 100%)"></span>
  <span style="position:absolute;top:16px;left:16px;background:rgba(255,253,248,0.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,253,248,0.28);color:#FFFDF8;font:700 10px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:0.18em;padding:8px 12px;border-radius:999px">{{ tag }}</span>
  <span style="position:absolute;top:16px;right:16px;width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,#F1CF7A,#C99A3E);color:#062319;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;box-shadow:0 8px 20px -8px rgba(233,196,106,0.8)">↗</span>
  <div style="position:absolute;left:0;right:0;bottom:0;padding:24px 24px 22px;display:flex;flex-direction:column;gap:8px">
    <span style="font:italic 500 15px/1 'Cormorant Garamond',serif;color:#F1CF7A">{{ local }}</span>
    <span style="font:600 34px/1 'Cormorant Garamond',serif;color:#FFFDF8;letter-spacing:-0.005em">{{ title }}</span>
    <p style="margin:2px 0 0;font-size:14px;line-height:1.55;color:#D6E3DB;text-wrap:pretty;max-width:420px">{{ blurb }}</p>
    <span style="margin-top:10px;padding-top:12px;border-top:1px solid rgba(233,196,106,0.25);font:700 10.5px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:0.16em;color:#E9C46A">{{ season }}</span>
  </div>
</a>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:340,&quot;height&quot;:440},&quot;href&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Tomato.dc.html&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;img&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;assets/tomato-1.jpg&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Tomato&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;local&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Thakkali&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;tag&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;YEAR-ROUND&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;blurb&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Firm hybrid and country tomatoes.&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;season&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;PEAK NOV–MAR&quot;,&quot;tsType&quot;:&quot;string&quot;}}"></script>
</body>
</html>
