<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="position:sticky;top:0;z-index:50;font-family:'Plus Jakarta Sans',sans-serif;background:rgba(5,30,22,0.82);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border-bottom:1px solid rgba(233,196,106,0.16);box-shadow:0 12px 40px -20px rgba(0,0,0,0.5)">
  <div style="background:#041A12;color:#CDB37A;font:600 11px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:0.14em">
    <div style="max-width:1320px;margin:0 auto;padding:9px clamp(18px,4vw,32px);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap">
      <sc-if value="{{ wideBar }}" hint-placeholder-val="{{ true }}"><span>PREMIUM B2B VEGETABLE SUPPLY · COIMBATORE → PAN-INDIA</span></sc-if>
      <div style="display:flex;gap:24px;flex-wrap:wrap">
        <a href="tel:+919800000000" style="color:#CDB37A;text-decoration:none" style-hover="color:#F1CF7A">+91 98000 00000</a>
        <a href="mailto:trade@organicexports.in" style="color:#CDB37A;text-decoration:none" style-hover="color:#F1CF7A">TRADE@ORGANICEXPORTS.IN</a>
      </div>
    </div>
  </div>
  <div style="max-width:1320px;margin:0 auto;padding:0 clamp(18px,4vw,32px);height:76px;display:flex;align-items:center;justify-content:space-between;gap:24px">
    <a href="Home.dc.html" style="display:flex;align-items:center;gap:13px;text-decoration:none">
      <span style="width:42px;height:42px;border-radius:50%;background:linear-gradient(145deg,#F1CF7A,#B8872F);padding:1.5px;flex:none;box-shadow:0 6px 18px -6px rgba(233,196,106,0.6)">
        <span style="width:100%;height:100%;border-radius:50%;background:#0A3B2C;display:flex;align-items:center;justify-content:center">
          <span style="width:13px;height:21px;background:linear-gradient(160deg,#F1CF7A,#C99A3E);border-radius:14px 0 14px 0;transform:rotate(22deg)"></span>
        </span>
      </span>
      <span style="display:flex;flex-direction:column;gap:4px">
        <span style="font:600 26px/1 'Cormorant Garamond',serif;color:#F5EFE0;letter-spacing:0.01em">Organic Exports</span>
        <span style="font:600 9px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:0.28em;color:#CDB37A">COIMBATORE · INDIA</span>
      </span>
    </a>
    <sc-if value="{{ isDesktop }}" hint-placeholder-val="{{ true }}">
      <nav style="display:flex;align-items:center;gap:32px">
        <a href="Vegetables.dc.html" style="position:relative;color:#F5EFE0;text-decoration:none;font-size:14.5px;font-weight:500;padding:8px 0" style-hover="color:#F1CF7A">Vegetables<sc-if value="{{ aVeg }}"><span style="position:absolute;left:0;right:0;bottom:-2px;height:2px;border-radius:2px;background:linear-gradient(90deg,#F1CF7A,#C99A3E)"></span></sc-if></a>
        <a href="Quality.dc.html" style="position:relative;color:#F5EFE0;text-decoration:none;font-size:14.5px;font-weight:500;padding:8px 0" style-hover="color:#F1CF7A">Quality<sc-if value="{{ aQuality }}"><span style="position:absolute;left:0;right:0;bottom:-2px;height:2px;border-radius:2px;background:linear-gradient(90deg,#F1CF7A,#C99A3E)"></span></sc-if></a>
        <a href="Logistics.dc.html" style="position:relative;color:#F5EFE0;text-decoration:none;font-size:14.5px;font-weight:500;padding:8px 0" style-hover="color:#F1CF7A">Logistics<sc-if value="{{ aLogistics }}"><span style="position:absolute;left:0;right:0;bottom:-2px;height:2px;border-radius:2px;background:linear-gradient(90deg,#F1CF7A,#C99A3E)"></span></sc-if></a>
        <a href="About.dc.html" style="position:relative;color:#F5EFE0;text-decoration:none;font-size:14.5px;font-weight:500;padding:8px 0" style-hover="color:#F1CF7A">About<sc-if value="{{ aAbout }}"><span style="position:absolute;left:0;right:0;bottom:-2px;height:2px;border-radius:2px;background:linear-gradient(90deg,#F1CF7A,#C99A3E)"></span></sc-if></a>
        <a href="Contact.dc.html" style="position:relative;color:#F5EFE0;text-decoration:none;font-size:14.5px;font-weight:500;padding:8px 0" style-hover="color:#F1CF7A">Contact<sc-if value="{{ aContact }}"><span style="position:absolute;left:0;right:0;bottom:-2px;height:2px;border-radius:2px;background:linear-gradient(90deg,#F1CF7A,#C99A3E)"></span></sc-if></a>
        <a href="Contact.dc.html#quote" style="background:linear-gradient(135deg,#F1CF7A,#C99A3E);color:#062319;text-decoration:none;font-size:14px;font-weight:700;padding:13px 22px;border-radius:999px;box-shadow:0 10px 26px -10px rgba(233,196,106,0.75);transition:transform .2s" style-hover="transform:translateY(-1px)">Request a Quote</a>
      </nav>
    </sc-if>
    <sc-if value="{{ isMobile }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ toggle }}" aria-label="Menu" style="width:46px;height:46px;border:1px solid rgba(233,196,106,0.4);background:transparent;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer">
        <span style="width:18px;height:1.5px;background:#F5EFE0"></span>
        <span style="width:18px;height:1.5px;background:#F5EFE0"></span>
        <span style="width:18px;height:1.5px;background:#F5EFE0"></span>
      </button>
    </sc-if>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <nav style="border-top:1px solid rgba(233,196,106,0.16);padding:12px clamp(18px,4vw,32px) 24px;display:flex;flex-direction:column;background:#062319">
      <a href="Vegetables.dc.html" style="color:#F5EFE0;text-decoration:none;font:600 28px/1 'Cormorant Garamond',serif;padding:14px 0;border-bottom:1px solid rgba(233,196,106,0.12)">Vegetables</a>
      <a href="Quality.dc.html" style="color:#F5EFE0;text-decoration:none;font:600 28px/1 'Cormorant Garamond',serif;padding:14px 0;border-bottom:1px solid rgba(233,196,106,0.12)">Quality</a>
      <a href="Logistics.dc.html" style="color:#F5EFE0;text-decoration:none;font:600 28px/1 'Cormorant Garamond',serif;padding:14px 0;border-bottom:1px solid rgba(233,196,106,0.12)">Logistics</a>
      <a href="About.dc.html" style="color:#F5EFE0;text-decoration:none;font:600 28px/1 'Cormorant Garamond',serif;padding:14px 0;border-bottom:1px solid rgba(233,196,106,0.12)">About</a>
      <a href="Contact.dc.html" style="color:#F5EFE0;text-decoration:none;font:600 28px/1 'Cormorant Garamond',serif;padding:14px 0;border-bottom:1px solid rgba(233,196,106,0.12)">Contact</a>
      <a href="Contact.dc.html#quote" style="margin-top:18px;background:linear-gradient(135deg,#F1CF7A,#C99A3E);color:#062319;text-decoration:none;font-size:15px;font-weight:700;padding:16px 20px;text-align:center;border-radius:999px">Request a Quote</a>
    </nav>
  </sc-if>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1320,&quot;height&quot;:140},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;vegetables&quot;,&quot;quality&quot;,&quot;logistics&quot;,&quot;about&quot;,&quot;contact&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1400, open: false };
  componentDidMount() { this.onR = () => this.setState({ w: window.innerWidth }); window.addEventListener('resize', this.onR); this.onR(); }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); }
  renderVals() {
    const a = this.props.active || '';
    const desk = this.state.w >= 1100;
    return {
      isDesktop: desk, wideBar: this.state.w >= 760, isMobile: !desk, menuOpen: !desk && this.state.open,
      toggle: () => this.setState(s => ({ open: !s.open })),
      aVeg: a === 'vegetables', aQuality: a === 'quality', aLogistics: a === 'logistics', aAbout: a === 'about', aContact: a === 'contact'
    };
  }
}
</script>
</body>
</html>
